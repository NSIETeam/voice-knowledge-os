<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Memory</title>
    <style>
      :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
      body { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
      .card { border: 1px solid #8885; border-radius: 12px; padding: 20px; margin-top: 18px; }
      .ok { color: #16833b; } .warn { color: #b15b00; }
      button { padding: 8px 14px; border-radius: 8px; border: 1px solid #8888; }
    </style>
  </head>
  <body>
    <h1>Voice Memory</h1>
    <p>Local-first voice knowledge compiler</p>
    <div class="card"><strong>本地处理节点</strong><p id="status">检查中…</p><button id="retry">重新检查</button></div>
    <div class="card"><strong>麦克风录音</strong><p id="recordStatus">未开始</p><button id="record">开始录音</button></div>
    <div class="card"><strong>隐私边界</strong><p>桌面壳只访问本机 loopback API。录音、转写和声纹数据不会因为打开界面而上传。</p></div>
    <script type="module">
      const status = document.querySelector('#status');
      const recordStatus = document.querySelector('#recordStatus');
      async function check() {
        status.className = '';
        status.textContent = '检查中…';
        try {
          const response = await fetch('http://127.0.0.1:8765/health');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          status.className = 'ok';
          status.textContent = '本地处理节点正常';
        } catch (error) {
          status.className = 'warn';
          status.textContent = '本地处理节点未启动，请先运行 voice-memory serve';
        }
      }
      document.querySelector('#retry').addEventListener('click', check);
      let recorder; let chunks = [];
      document.querySelector('#record').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        if (recorder?.state === 'recording') { recorder.stop(); button.textContent = '开始录音'; return; }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({audio: true});
          recorder = new MediaRecorder(stream); chunks = [];
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = async () => {
            stream.getTracks().forEach(track => track.stop());
            const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
            const bytes = new Uint8Array(await blob.arrayBuffer());
            let binary = ''; bytes.forEach(byte => binary += String.fromCharCode(byte));
            const response = await fetch('http://127.0.0.1:8765/ledger/upload', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:'microphone.webm', data_base64:btoa(binary)})});
            recordStatus.textContent = response.ok ? '录音已写入本地音频账本' : '写入失败，请检查本地节点';
          };
          recorder.start(); button.textContent = '停止并保存'; recordStatus.textContent = '录音中（仅麦克风）';
        } catch (error) { recordStatus.textContent = `无法访问麦克风：${error.message}`; }
      });
      check();
    </script>
  </body>
</html>
