[package]
name = "voice-memory-desktop"
version = "0.1.0"
description = "Voice Memory desktop shell"
authors = ["Voice Memory contributors"]
edition = "2021"

[lib]
name = "voice_memory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
