name: Desktop shell

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"

jobs:
  build-shell:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --name voice-memory-node --paths ../src sidecar_entry.py
          mkdir -p src-tauri/binaries
          cp dist/voice-memory-node src-tauri/binaries/voice-memory-node-${{ matrix.target }}
      - name: Smoke test bundled local processing node
        working-directory: desktop
        shell: bash
        run: ./src-tauri/binaries/voice-memory-node-${{ matrix.target }} --help
      - name: Generate deterministic application icon
        working-directory: desktop
        run: python scripts/generate_icon.py
      - name: Build desktop shell
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}
      - name: Write bundle SHA-256 manifests
        working-directory: desktop
        run: python scripts/write_hashes.py src-tauri/target
      - name: Install and launch Windows MSI smoke test
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "Windows MSI not found" }
          $log = Join-Path $env:TEMP 'voice-memory-msi.log'
          $arguments = "/i `"$($msi.FullName)`" /qn /norestart /L*v `"$log`""
          $install = Start-Process msiexec.exe -ArgumentList $arguments -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "msiexec did not finish within 120 seconds"
          }
          if ($install.ExitCode -ne 0) { throw "msiexec failed with exit code $($install.ExitCode)" }
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Voice Memory" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed Voice Memory executable not found" }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed Voice Memory process exited during launch smoke test" }
          Stop-Process -Id $app.Id -Force
      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-memory-${{ matrix.target }}
          path: desktop/src-tauri/target/**/bundle/**
          if-no-files-found: error
