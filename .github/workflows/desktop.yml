name: Desktop shell

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "src/**"
      - "pyproject.toml"

jobs:
  build-shell:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --name voice-memory-node --paths ../src sidecar_entry.py
          mkdir -p src-tauri/binaries
          source="dist/voice-memory-node"
          suffix=""
          if [[ -f "${source}.exe" ]]; then source="${source}.exe"; suffix=".exe"; fi
          if [[ ! -f "$source" ]]; then echo "PyInstaller sidecar not found: $source"; exit 1; fi
          binary="src-tauri/binaries/voice-memory-node-${{ matrix.target }}${suffix}"
          cp "$source" "$binary"
      - name: Smoke test bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          binary="src-tauri/binaries/voice-memory-node-${{ matrix.target }}"
          if [[ -f "${binary}.exe" ]]; then binary="${binary}.exe"; fi
          "$binary" --help
      - name: Generate deterministic application icon
        working-directory: desktop
        run: python scripts/generate_icon.py
      - name: Build desktop shell
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}
      - name: Write bundle SHA-256 manifests
        working-directory: desktop
        run: python scripts/write_hashes.py src-tauri/target
      - name: Install and launch Windows MSI smoke test
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "Windows MSI not found" }
          $log = Join-Path $env:TEMP 'voice-memory-msi.log'
          $arguments = "/i `"$($msi.FullName)`" /qn /norestart /L*v `"$log`""
          $install = Start-Process msiexec.exe -ArgumentList $arguments -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "msiexec did not finish within 120 seconds"
          }
          if ($install.ExitCode -ne 0) { throw "msiexec failed with exit code $($install.ExitCode)" }
          $exe = Get-ChildItem -Path "$env:ProgramFiles\Voice Memory" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed Voice Memory executable not found" }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $health = $null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if ($app.HasExited) { throw "Installed Voice Memory process exited during startup" }
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 2
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $health -or $health.status -ne 'ok' -or $health.service -ne 'voice-memory') {
            throw "Installed app did not start its bundled local API sidecar"
          }
          $profiles = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/profiles' -TimeoutSec 5
          if ($profiles.PSObject.Properties.Count -ne 7) { throw "Expected seven processing profiles from installed sidecar" }
          if (-not $app.CloseMainWindow() -or -not $app.WaitForExit(15000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "Installed Voice Memory process did not close gracefully"
          }
          $sidecarStopped = $false
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 1 | Out-Null
              Start-Sleep -Seconds 1
            } catch { $sidecarStopped = $true; break }
          }
          if (-not $sidecarStopped) { throw "Bundled local API sidecar remained running after the app closed" }
      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-memory-${{ matrix.target }}
          path: desktop/src-tauri/target/**/bundle/**
          if-no-files-found: error
