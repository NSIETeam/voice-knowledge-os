name: Desktop shell

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

jobs:
  build-shell:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate acceptance script before packaging
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/desktop/scripts/windows-install-smoke.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --name voice-memory-node --paths ../src sidecar_entry.py
          mkdir -p src-tauri/binaries
          source="dist/voice-memory-node"
          suffix=""
          if [[ -f "${source}.exe" ]]; then source="${source}.exe"; suffix=".exe"; fi
          if [[ ! -f "$source" ]]; then echo "PyInstaller sidecar not found: $source"; exit 1; fi
          binary="src-tauri/binaries/voice-memory-node-${{ matrix.target }}${suffix}"
          cp "$source" "$binary"
      - name: Smoke test bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          binary="src-tauri/binaries/voice-memory-node-${{ matrix.target }}"
          if [[ -f "${binary}.exe" ]]; then binary="${binary}.exe"; fi
          "$binary" --help
      - name: Generate deterministic application icon
        working-directory: desktop
        run: python scripts/generate_icon.py
      - name: Test Windows capture adapter and desktop Rust target
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        run: cargo test --release --target ${{ matrix.target }} --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop shell
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}
      - name: Write bundle SHA-256 manifests
        working-directory: desktop
        run: python scripts/write_hashes.py src-tauri/target
      - name: Install and launch Windows MSI smoke test
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - name: Upload Windows acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-diagnostics
          path: desktop/smoke-diagnostics/**
          if-no-files-found: warn
      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-memory-${{ matrix.target }}
          path: desktop/src-tauri/target/**/bundle/**
          if-no-files-found: error
