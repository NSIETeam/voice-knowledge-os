name: Desktop shell

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"

jobs:
  build-shell:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build bundled local processing node
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --onefile --name voice-memory-node --paths ../src sidecar_entry.py
          mkdir -p src-tauri/binaries
          cp dist/voice-memory-node src-tauri/binaries/voice-memory-node-${{ matrix.target }}
      - name: Smoke test bundled local processing node
        working-directory: desktop
        shell: bash
        run: ./src-tauri/binaries/voice-memory-node-${{ matrix.target }} --help
      - name: Generate deterministic application icon
        working-directory: desktop
        run: python scripts/generate_icon.py
      - name: Build desktop shell
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }}
      - name: Upload desktop bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voice-memory-${{ matrix.target }}
          path: desktop/src-tauri/target/**/bundle/**
          if-no-files-found: error
