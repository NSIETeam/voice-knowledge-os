[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-memory"
version = "0.1.0"
description = "Local-first, evidence-linked voice knowledge compiler for Obsidian"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Voice Memory contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
voice-memory = "voice_memory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
